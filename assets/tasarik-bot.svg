<svg width="1200" height="480" viewBox="0 0 1200 480" xmlns="http://www.w3.org/2000/svg">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="480"><stop stop-color="#050505"/><stop offset=".5" stop-color="#0B1220"/><stop offset="1" stop-color="#050505"/></linearGradient>
 <linearGradient id="metal" x1="440" y1="100" x2="750" y2="400"><stop stop-color="#F5F7FA"/><stop offset=".45" stop-color="#9CA3AF"/><stop offset="1" stop-color="#343A46"/></linearGradient>
 <radialGradient id="blue"><stop stop-color="#64D2FF"/><stop offset="1" stop-color="#0A84FF"/></radialGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#0A84FF" stroke-opacity=".07"/></pattern>
</defs>
<rect width="1200" height="480" rx="30" fill="url(#bg)"/><rect width="1200" height="480" rx="30" fill="url(#grid)"/>

<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
